name: Cyber Security News Notifier

on:
  schedule:
    - cron: '0 * * * *' # Run hourly
  workflow_dispatch: # Allow manual triggers

permissions:
  contents: write

jobs:
  run-notifier:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Notifier Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
          HACKER_NEWS_FEED_URL: ${{ secrets.HACKER_NEWS_FEED_URL }}
          BLEEPING_COMPUTER_FEED_URL: ${{ secrets.BLEEPING_COMPUTER_FEED_URL }}
        run: |
          python cyber_news.py

      - name: Commit and Push Seen Items Database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Check if seen_items.json was created/updated
          git add seen_items.json
          git commit -m "chore: Update seen items database [skip ci]" || exit 0
          git push
